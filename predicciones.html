<!DOCTYPE html>
<html lang="es">
<head>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Predicciones Meteorológicas</title>
  <link rel="stylesheet" href="styles_predicciones.css">
</head>
<body>
  <nav class="main-nav">
    <a href="index.html" class="nav-btn">Observaciones y datos actuales</a>
    <a href="predicciones.html" class="nav-btn active">Predicciones (deterministas)</a>
    <a href="aviation.html" class="nav-btn">Predicciones aeronáuticas</a>
  </nav>
  <main class="content-container">
    <button id="openMeteogramBtn" style="background-color: #ffe23d; color: black; border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 18px;">¡Abre el Meteograma!</button>
    <button id="models-comparasion" style="background-color: #ffe23d; color: black; border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 18px;">¡Abre el Comparador de modelos!</button>
    <div class="control-panel-main">
      <div class="panel-group">
        <label>Región:</label>
        <select id="region-select">
          <option value="peninsula" selected>Península Ibérica</option>
          <option value="europa">Europa</option>
        </select>
      </div>
      <div class="panel-group">
        <label>*Si algún modelo no carga, normalmente solo hay seleccionar la hora de salida anterior del desplegable</label>
        <div id="models-container" class="checkbox-group"></div>
      </div>
      <div class="panel-group">
        <label>Producto:</label>
        <select id="product-select">
          <option value="precip">Precipitaciones</option>
          <option value="precip_acc">Precipitación acumulada</option>
          <option value="agua_precip">Agua precipitable</option>
          <option value="clouds">Nubosidad</option>
          <option value="t2m">Temperatura 2m</option>
          <option value="t850">Temperatura 850hPa (≈1500m)</option>
          <option value="t500">Temperatura 500hPa (≈5500m)</option>
          <option value="wind10m">Viento medio 10m</option>
          <option value="gust10m">Rachas 10m</option>
          <option value="wind700_850">Viento 700-850hPa (≈1500-3000m)</option>
          <option id="opt-wind900" value="wind900">Viento 900hPa (≈990m)</option>
          <option id="opt-jetstream" value="jetstream" style="display: none;">JetStream 300hPa (≈9000m)</option>
          <option value="geop500">Presión y geopotencial 500hPa (≈5500m)</option>
          <option value="cape">CAPE</option>
          <option value="anom850">Anomalía Temp 850hPa (solo Europa)</option>
        </select>
      </div>
      <div class="panel-group">
        <p style="font-size: 0.85rem; color: #aaa;">INFO:</p>
        <span id="models-limit-info" class="models-limit-info"></span>
      </div>
    </div>
    <div class="panel-group time-nav">
      <div id="model-selector-buttons"></div>
      <div class="time-btn-container">
        <button id="minus12-time-btn">‹ -6h</button>
        <button id="prev-time-btn">‹ -1h</button>
        <span id="forecast-hour-label">Pronóstico: +0h</span>
        <button id="next-time-btn">+1h ›</button>
        <button id="plus12-time-btn">+6h ›</button>
      </div>
      <div class="time-picker-row">
        <input type="datetime-local" id="date-picker-select" class="date-picker-input">
        <div class="slider-wrapper">
          <input type="range" id="hour-picker-slider" min="0" max="239" step="1" value="0" list="slider-ticks">
          <datalist id="slider-ticks"></datalist>
          <div id="slider-ticks-labels" class="ticks-labels-container"></div>
        </div>
      </div>
    </div>
    <div id="images-display-container" class="images-container"></div>
  </main>
  <footer class="main-footer">
    <p>Mapas de <a href="https://www.meteociel.fr/index.php?region=sp" target="_blank" rel="noopener">Meteociel.fr</a>, meteograma y comparador de <a href="https://open-meteo.com/en/docs" target="_blank" rel="noopener">Open-Meteo</a></p>
  </footer>
  <div id="meteogramModal" class="meteogram-modal hidden">
  <div class="meteogram-modal-content">
    <div class="meteogram-header">
      <div class="meteogram-controls">
        <select id="meteogram-mode">
            <option value="MeteoGraph">Diagrama</option>
            <option value="MeteoTable">Tabla detallada</option>
        </select>
        <button id="useLocationBtn" title="Usar mi ubicación actual">Usar ubicación actual</button>
        <input type="text" id="citySearchInput" placeholder="Ciudad o Lat,Lon" />
        <button id="fetchMeteogramBtn">← Buscar ubicación / Refrescar modelo →</button>
        <select id="meteogramModelSelect">
          <option value="ecmwf_ifs&forecast_days=10">ECMWF</option>
          <option value="dwd_icon_seamless">ICON-EU</option>
          <option value="meteofrance_seamless&forecast_days=4">ARPEGE-AROME</option>
          <option value="ncep_gfs_seamless">GFS</option>
          <option value="ukmo_seamless">UKMO</option>
        </select>
      </div>
      <button id="closeMeteogramBtn" class="close-btn">&times;</button>
    </div>
    <div id="meteogramLoading" class="meteogram-loading hidden">Cargando datos...</div>
    <div class="meteogram-scroll-container">
      <div id="meteogramChartWrapper" class="meteogram-chart-container hidden">
        <canvas id="meteogramChart"></canvas>
      </div>
      <table id="meteogramTable" class="meteogram-table">
        <thead id="meteogramTableHead"></thead>
        <tbody id="meteogramTableBody"></tbody>
      </table>
    </div>
  </div>
</div>
<div id="modelCompareModal" class="meteogram-modal hidden">
  <div class="meteogram-modal-content">
    <div class="meteogram-header">
      <div class="meteogram-controls">
        <button id="compareUseLocationBtn" title="Usar mi ubicación actual">Usar ubicación actual</button>
        <input type="text" id="compareCitySearchInput" placeholder="Ciudad o Lat,Lon" />
        <button id="fetchCompareBtn">← Buscar ubicación / Refrescar →</button>
        <select id="compareVariableSelect">
          <option value="temperature_2m">Temperatura 2m (°C)</option>
          <option value="precipitation">Precipitación (mm)</option>
          <option value="wind_speed_10m">Viento (km/h)</option>
          <option value="wind_gusts_10m">Rachas de viento (km/h)</option>
          <option value="cloud_cover">Nubosidad (%)</option>
          <option value="dew_point_2m">Punto de rocío (°C)</option>
        </select>
      </div>
      <button id="closeCompareBtn" class="close-btn">&times;</button>
    </div>
    <div id="compareLoading" class="meteogram-loading hidden">Cargando datos de todos los modelos...</div>
    <div class="meteogram-scroll-container">
      <table id="compareTable" class="meteogram-table">
        <thead id="compareTableHead"></thead>
        <tbody id="compareTableBody"></tbody>
      </table>
    </div>
  </div>
</div>
  <script src="script_predicciones.js"></script>
</body>
</html>
